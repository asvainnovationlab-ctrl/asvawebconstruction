name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  # CI-only throwaway values.
  JWT_ACCESS_SECRET: ci-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  TOKEN_HASH_SECRET: ci-hash-secret-0123456789-abcdefghijklmnopqrstuvwxyz-x
  REVALIDATE_SECRET: ci-revalidate-secret-0123456789
  DEMO_USER_PASSWORD: Ci-Demo-Passw0rd!2026

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asva_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asva_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asva_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run db:generate
      - name: Dependency audit (production dependencies)
        run: npm run audit:deps
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: API integration tests (real PostgreSQL)
        run: npm run test:integration -w @asva/api
      - name: Production builds
        run: npm run build -w @asva/api && npm run build -w @asva/web
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # ---------------------------------------------------------------- end-to-end
      - name: Prepare end-to-end database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE asva_e2e"
          npm run db:migrate:deploy
          npm run db:seed:demo
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_START_SERVERS: '1'
          E2E_BASE_URL: http://localhost:3000
          NODE_ENV: production
          FRONTEND_URL: http://localhost:3000
          API_INTERNAL_URL: http://localhost:4000
          WEB_REVALIDATE_URL: http://localhost:3000/api/revalidate
          COOKIE_SECURE: 'true' # Chrome treats http://localhost as secure
          SCHEDULER_ENABLED: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
